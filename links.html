<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links | Just The Tips Nail Co.</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* Cottagecore Color Palette */
        :root {
            --canvas-cream: #F4F1EA;
            --bark-brown: #3E362E;
            --sage-green: #8A9A86;
            --foraged-mushroom: #D1C7B8;
            --soft-white: #FDFBF7;
        }

        /* Global Styles */
        body {
            margin: 0;
            padding: 3rem 1.5rem;
            background-color: var(--canvas-cream);
            color: var(--bark-brown);
            font-family: 'Lora', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* The container limits the width on desktop to look like a phone app */
        .link-container {
            width: 100%;
            max-width: 500px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
        }

        /* Profile Header */
        .profile-section {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            background-color: var(--foraged-mushroom);
            border-radius: 50%;
            margin: 0 auto 1rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            border: 4px solid var(--soft-white);
            box-shadow: 0 4px 10px rgba(62, 54, 46, 0.08);
            overflow: hidden;
        }

        .profile-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            margin: 0;
            color: var(--bark-brown);
            letter-spacing: 0.5px;
        }

        .profile-handle {
            font-style: italic;
            font-size: 1.1rem;
            opacity: 0.8;
            margin-top: 0.2rem;
        }

        /* Booking Button Group */
        .featured-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .booking-note {
            font-style: italic;
            font-size: 0.95rem;
            color: var(--sage-green);
            font-weight: bold;
            text-align: center;
        }

        /* Link Buttons */
        .link-btn {
            width: 100%;
            padding: 1.2rem;
            background-color: var(--soft-white);
            color: var(--bark-brown);
            text-decoration: none;
            text-align: center;
            border: 1px solid var(--foraged-mushroom);
            border-radius: 12px;
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(62, 54, 46, 0.04);
            box-sizing: border-box;
            position: relative;
        }

        .link-btn:hover, .link-btn:active {
            transform: translateY(-3px);
            background-color: var(--sage-green);
            color: var(--canvas-cream);
            border-color: var(--sage-green);
            box-shadow: 0 6px 12px rgba(62, 54, 46, 0.1);
        }

        /* Highlighted primary button */
        .link-btn.featured {
            background-color: var(--sage-green);
            color: var(--canvas-cream);
            border-color: var(--sage-green);
        }

        .link-btn.featured:hover, .link-btn.featured:active {
            background-color: #6d7b69; 
            border-color: #6d7b69;
        }

        /* Small Footer */
        .footer-text {
            margin-top: 3rem;
            font-size: 0.9rem;
            opacity: 0.6;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="link-container">
        
        <div class="profile-section">
            <div class="profile-pic">🍄</div>
            <h1 class="profile-title">Just The Tips</h1>
            <div class="profile-handle">@justthetipsnailco</div>
        </div>

        <!-- The main booking/featured link -->
        <div class="featured-wrapper">
            <a href="https://home.shortcutssoftware.com/morgantownbeautycollege#/_h/sites/32483/details?servicesId=367" class="link-btn featured" target="_blank">Book an Appointment</a>
            <div class="booking-note">* Please select <strong>Jacklyn</strong> as your nail tech!</div>
        </div>

        <!-- Other Links -->
        <a href="index.html#services" class="link-btn">Service Menu & Pricing</a>
        <a href="https://www.instagram.com/justthetipsnailco/" class="link-btn" target="_blank">Instagram Portfolio</a>
        <a href="https://www.facebook.com/profile.php?id=61591643291507" class="link-btn" target="_blank">Facebook Page</a>
        <a href="index.html" class="link-btn">Visit Our Website</a>

        <div class="footer-text">
            &copy; 2026 Just The Tips Nail Co. LLC
        </div>
        
    </div>

</body>
</html>
